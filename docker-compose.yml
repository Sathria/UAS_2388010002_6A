version: '3.8'

services:
  # 1. CONTAINER WEB STATIS PORTOFOLIO (Port 80)
  static-cv:
    build: ./static-cv
    container_name: uas-static-container
    ports:
      - "80:80"
    restart: always

  # 2. CONTAINER DATABASE MARIADB
  db-webdinamis:
    image: mariadb:lts
    container_name: uas-db-container
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_ROOT_PASSWORD: ''
      MYSQL_DATABASE: 'dbcompro_uas_2388010002'
    ports:
      - "3306:3306"
    volumes:
      - ./dynamic-app/db_data:/docker-entrypoint-initdb.d
    restart: always

  # 3. CONTAINER WEB DINAMIS RATING GAME PERSONA 5 (Port 3000)
  dynamic-app:
    build: ./dynamic-app
    container_name: uas-dinamis-container
    ports:
      - "3000:80"
    volumes:
      - ./dynamic-app/uploads:/var/www/html/uploads
    command: /bin/sh -c "mkdir -p /var/www/html/uploads && chmod -R 777 /var/www/html/uploads && apache2-foreground"
    depends_on:
      - db-webdinamis
    restart: always
