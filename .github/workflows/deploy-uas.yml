name: CI/CD Pipeline UAS Cloud Computing

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Static CV Image
      uses: docker/build-push-action@v4
      with:
        context: ./static-cv
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/uas-static-cv:latest

    - name: Build and Push Dynamic App Image
      uses: docker/build-push-action@v4
      with:
        context: ./dynamic-app
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/uas-dynamic-app:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Executing remote ssh commands using password
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        script: |
          cd ~/uas-cloud
          git pull origin main
          docker compose down
          docker compose pull
          docker compose up -d --build