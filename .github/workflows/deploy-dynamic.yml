name: Deploy Dynamic App

on:
  push:
    branches: [ main ]
    paths:
      - 'dynamic-app/**'

jobs:
  build-and-push-dynamic:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Dynamic App Image
      uses: docker/build-push-action@v4
      with:
        context: ./dynamic-app
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/uas-dynamic-app:latest

  deploy-dynamic-to-ec2:
    needs: build-and-push-dynamic
    runs-on: ubuntu-latest
    steps:
    - name: Executing remote ssh commands
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        script: |
          cd ~/uas-cloud
          git reset --hard HEAD
          git clean -fd
          git pull origin main
          docker compose stop dynamic-app || true
          docker compose rm -f dynamic-app || true
          docker compose up -d --build --force-recreate dynamic-app