name: Deploy Static CV

on:
  push:
    branches: [ main ]
    paths:
      - 'static-cv/**' # Pipeline ini hanya jalan jika folder static-cv berubah

jobs:
  build-and-push-static:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Static CV Image
      uses: docker/build-push-action@v4
      with:
        context: ./static-cv
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/uas-static-cv:latest

  deploy-static-to-ec2:
    needs: build-and-push-static
    runs-on: ubuntu-latest
    steps:
    - name: Executing remote ssh commands
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        script: |
          cd ~/uas-cloud
          git pull origin main
          docker compose up -d --build static-cv